---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - secrets
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - database.serenedb.com
  resources:
  - backups
  - databaseroles
  - databases
  - scheduledbackups
  - serenedbs
  - serversecrets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - database.serenedb.com
  resources:
  - backups/finalizers
  - databaseroles/finalizers
  - databases/finalizers
  - scheduledbackups/finalizers
  - serenedbs/finalizers
  - serversecrets/finalizers
  verbs:
  - update
- apiGroups:
  - database.serenedb.com
  resources:
  - backups/status
  - databaseroles/status
  - databases/status
  - scheduledbackups/status
  - serenedbs/status
  - serversecrets/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - networking.k8s.io
  resources:
  - networkpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - snapshot.storage.k8s.io
  resources:
  - volumesnapshots
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
