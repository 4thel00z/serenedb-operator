apiVersion: database.serenedb.com/v1alpha1
kind: SereneDB
metadata:
  name: serenedb-secure
spec:
  auth:
    existingSecret: serenedb-secure-credentials
  tls:
    enabled: true
    secretName: serenedb-secure-tls
    minVersion: "1.3"
  listeners:
    postgres:
      port: 7890
      sslmode: require
    http:
      enabled: true
      port: 9200
  config:
    cpuThreads: 4
    ioThreads: 2
    hba: |
      local all all scram-sha-256
      host  all all 0.0.0.0/0 scram-sha-256
      host  all all ::/0      scram-sha-256
  networkPolicy:
    enabled: true
  persistence:
    size: 100Gi
    storageClassName: fast-ssd
    retentionPolicy:
      whenDeleted: Retain
  resources:
    requests:
      cpu: "4"
      memory: 16Gi
    limits:
      cpu: "4"
      memory: 16Gi
